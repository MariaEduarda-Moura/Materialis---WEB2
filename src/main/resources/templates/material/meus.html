<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#3C1EDF">
    <title th:text="#{nav.meusMateriais}">Meus Materiais</title>
    <link rel="stylesheet" th:href="@{/css/materialis.css}" />
</head>
<body>
    <header class="main-header">
        <a th:href="@{/}" class="logo">Materialis</a>
        <th:block th:replace="~{fragments/nav :: barra}"></th:block>
    </header>

    <div class="pagina-cabecalho">
        <div>
            <h1 th:text="#{nav.meusMateriais}">Meus Materiais</h1>
            <p th:text="#{material.meus.subtitulo}">Acompanhe a situação de cada item que você disponibilizou para empréstimo.</p>
        </div>
        <a class="btn-claro" th:href="@{/materiais/cadastrar}" role="button" th:text="#{button.novo.material}">Novo Material</a>
    </div>

    <div th:if="${sucesso}" class="flash success" role="alert">
        <span th:text="${sucesso}"></span>
    </div>
    <div th:if="${fail}" class="flash fail" role="alert">
        <span th:text="${fail}"></span>
    </div>

    <div th:replace="~{fragments/material-cards :: grid(${materiais}, ${emprestimosVigentes}, ${usuarioLogadoId}, 'meus')}"></div>

    <footer>
        <p th:text="#{footer.texto}">&copy; 2025 Materialis</p>
    </footer>
    <div th:replace="~{fragments/nav :: tabs('meusMateriais')}"></div>
</body>
</html>
