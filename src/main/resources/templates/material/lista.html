<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#3C1EDF">
    <title th:text="#{title.lista.materiais}">Materiais</title>
    <link rel="stylesheet" th:href="@{/css/materialis.css}" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <header class="main-header">
        <a th:href="@{/}" class="logo">Materialis</a>
        <th:block th:replace="~{fragments/nav :: barra}"></th:block>
    </header>

    <div class="catalogo-header">
        <div>
            <h1 th:text="#{material.catalogo.titulo}">Materiais para empréstimo</h1>
            <p class="catalogo-subtitulo" th:text="#{material.catalogo.subtitulo}">Encontre livros, calculadoras e kits disponíveis na comunidade acadêmica.</p>
        </div>
        <form th:action="@{/materiais/listar}" method="get" class="filter-form">
            <input type="text" name="palavra" th:value="${param.palavra}" th:placeholder="#{filtro.placeholder.palavra}" />
            <select name="categoria">
                <option value="" th:text="#{filtro.todas.categorias}">Todas as categorias</option>
                <option th:each="cat : ${T(br.ufscar.dc.dsw.domain.Material.Categoria).values()}"
                        th:value="${cat}" th:text="#{${'material.categoria.' + cat}}"
                        th:selected="${param.categoria != null and param.categoria[0] == cat.name()}"></option>
            </select>
            <button type="submit" th:text="#{button.filtrar}">Filtrar</button>
        </form>
    </div>

    <div th:if="${sucesso}" class="flash success" role="alert">
        <span th:text="${sucesso}"></span>
    </div>
    <div th:if="${fail}" class="flash fail" role="alert">
        <span th:text="${fail}"></span>
    </div>

    <div th:replace="~{fragments/material-cards :: grid(${materiais}, ${emprestimosVigentes}, ${usuarioLogadoId}, 'vitrine')}"></div>

    <footer>
        <p th:text="#{footer.texto}">&copy; 2025 Materialis</p>
    </footer>
    <div th:replace="~{fragments/nav :: tabs('materiais')}"></div>
</body>
</html>
