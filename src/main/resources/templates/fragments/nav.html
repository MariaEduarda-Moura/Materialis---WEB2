<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <!--
        Fragmentos de navegação.

        barra -> inserido DENTRO de <header class="main-header">:
                 hambúrguer + fundo escurecido + gaveta de navegação.
                 No celular vira gaveta; a partir de 768px fica em linha, no topo.
                 O abre/fecha usa só um checkbox (:checked), sem JavaScript.

        tabs(ativo) -> barra de abas fixa no rodapé, visível só no celular.
                       'ativo' recebe: materiais | meusMateriais | meusEmprestimos |
                       solicitacoes | estudantes | '' (nenhuma).
    -->

    <th:block th:fragment="barra">
        <input type="checkbox" id="nav-toggle" class="nav-toggle" hidden />
        <label for="nav-toggle" class="nav-toggle-label" th:attr="aria-label=#{nav.abrirMenu}">
            <span></span>
            <span></span>
            <span></span>
        </label>
        <label for="nav-toggle" class="nav-backdrop" aria-hidden="true"></label>

        <nav class="nav-principal">
            <ul>
                <li><a th:href="@{/}" th:text="#{nav.materiais}">Materiais</a></li>
                <li sec:authorize="hasRole('USER')"><a th:href="@{/materiais/cadastrar}" th:text="#{nav.cadastrarMaterial}">Cadastrar Material</a></li>
                <li sec:authorize="hasRole('USER')"><a th:href="@{/materiais/meus-materiais}" th:text="#{nav.meusMateriais}">Meus Materiais</a></li>
                <li sec:authorize="hasRole('USER')"><a th:href="@{/emprestimos/meus-emprestimos}" th:text="#{nav.meusEmprestimos}">Meus Empréstimos</a></li>
                <li sec:authorize="hasRole('USER')"><a th:href="@{/emprestimos/solicitacoes-para-meus-materiais}" th:text="#{nav.solicitacoesRecebidas}">Solicitações Recebidas</a></li>
                <li sec:authorize="hasRole('ADMIN')"><a th:href="@{/estudantes/listar}" th:text="#{nav.estudantes}">Estudantes</a></li>
                <li sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" class="logout-form">
                        <button type="submit" th:text="#{nav.logout}">Logout</button>
                    </form>
                </li>
                <li sec:authorize="isAnonymous()"><a th:href="@{/login}" th:text="#{nav.login}">Login</a></li>
            </ul>
        </nav>
    </th:block>

    <nav th:fragment="tabs(ativo)" class="bottom-nav" th:attr="aria-label=#{nav.abas}">
        <ul>
            <li th:classappend="${ativo == 'materiais'} ? 'ativo'">
                <a th:href="@{/}" th:attr="aria-label=#{tab.materiais}">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/></svg>
                    <span class="rotulo" th:text="#{tab.materiais}">Materiais</span>
                </a>
            </li>
            <li sec:authorize="hasRole('USER')" th:classappend="${ativo == 'meusMateriais'} ? 'ativo'">
                <a th:href="@{/materiais/meus-materiais}" th:attr="aria-label=#{tab.meusMateriais}">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg>
                    <span class="rotulo" th:text="#{tab.meusMateriais}">Meus itens</span>
                </a>
            </li>
            <li sec:authorize="hasRole('USER')" th:classappend="${ativo == 'meusEmprestimos'} ? 'ativo'">
                <a th:href="@{/emprestimos/meus-emprestimos}" th:attr="aria-label=#{tab.meusEmprestimos}">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h13l-3.5-3.5M20 15H7l3.5 3.5"/></svg>
                    <span class="rotulo" th:text="#{tab.meusEmprestimos}">Empréstimos</span>
                </a>
            </li>
            <li sec:authorize="hasRole('USER')" th:classappend="${ativo == 'solicitacoes'} ? 'ativo'">
                <a th:href="@{/emprestimos/solicitacoes-para-meus-materiais}" th:attr="aria-label=#{tab.solicitacoes}">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4z"/><path d="M4 13h4.5l1.5 2.5h4L15.5 13H20"/></svg>
                    <span class="rotulo" th:text="#{tab.solicitacoes}">Pedidos</span>
                </a>
            </li>
            <li sec:authorize="hasRole('ADMIN')" th:classappend="${ativo == 'estudantes'} ? 'ativo'">
                <a th:href="@{/estudantes/listar}" th:attr="aria-label=#{tab.estudantes}">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/><path d="M3 20a5.5 5.5 0 0 1 11 0"/><path d="M16.5 11.5a3 3 0 0 0 0-6"/><path d="M17.5 20a5.5 5.5 0 0 0-3-4.9"/></svg>
                    <span class="rotulo" th:text="#{tab.estudantes}">Estudantes</span>
                </a>
            </li>
            <li sec:authorize="isAnonymous()" th:classappend="${ativo == 'login'} ? 'ativo'">
                <a th:href="@{/login}" th:attr="aria-label=#{tab.entrar}">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h5v16h-5"/><path d="M11 8l4 4-4 4M4 12h11"/></svg>
                    <span class="rotulo" th:text="#{tab.entrar}">Entrar</span>
                </a>
            </li>
            <li sec:authorize="isAuthenticated()" class="aba-mais">
                <label for="nav-toggle" class="nav-toggle-label-abas" th:attr="aria-label=#{tab.mais}">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg>
                    <span class="rotulo" th:text="#{tab.mais}">Mais</span>
                </label>
            </li>
        </ul>
    </nav>
</body>
</html>
