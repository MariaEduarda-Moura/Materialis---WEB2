<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#3C1EDF">
    <title th:text="${estudante.id} == null ? #{title.cadastrar.estudante} : #{title.editar.estudante}">Estudante</title>
    <link rel="stylesheet" th:href="@{/css/materialis.css}" />
</head>
<body>
    <header class="main-header">
        <a th:href="@{/}" class="logo">Materialis</a>
        <th:block th:replace="~{fragments/nav :: barra}"></th:block>
    </header>

    <div class="pagina-cabecalho">
        <div>
            <h1 th:text="${estudante.id} == null ? #{title.cadastrar.estudante} : #{title.editar.estudante}">Cadastrar Estudante</h1>
            <p th:text="#{estudante.form.subtitulo}">Dados de acesso e identificação do estudante.</p>
        </div>
    </div>

    <main class="form-card">
        <form th:action="${estudante.id == null} ? @{/estudantes/salvar} : @{/estudantes/editar}" th:object="${estudante}" method="POST">
            <input type="hidden" th:field="*{id}" />

            <div class="form-grade">
                <div class="campo">
                    <label for="nome" th:text="#{estudante.nome.label}">Nome</label>
                    <input type="text" id="nome" placeholder="Nome" autofocus="autofocus" th:field="*{nome}"
                           th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'" />
                    <div class="erro-campo" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                </div>

                <div class="campo">
                    <label for="email" th:text="#{estudante.email.label}">E-mail</label>
                    <input type="email" id="email" placeholder="email@email.com" th:field="*{email}"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" />
                    <div class="erro-campo" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="campo">
                    <label for="senha" th:text="#{estudante.senha.label}">Senha</label>
                    <input type="password" id="senha" placeholder="Senha" th:field="*{senha}"
                           th:classappend="${#fields.hasErrors('senha')} ? 'is-invalid'" />
                    <div class="erro-campo" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></div>
                </div>

                <div class="campo">
                    <label for="cpf" th:text="#{estudante.cpf.label}">CPF</label>
                    <input type="text" id="cpf" placeholder="___.___.___-__" th:field="*{cpf}"
                           th:classappend="${#fields.hasErrors('cpf')} ? 'is-invalid'"
                           data-mask="000.000.000-00" data-mask-reverse="true" />
                    <div class="erro-campo" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}"></div>
                </div>

                <div class="campo">
                    <label for="ra" th:text="#{estudante.ra.label}">RA</label>
                    <input type="text" id="ra" placeholder="______" th:field="*{ra}"
                           th:classappend="${#fields.hasErrors('ra')} ? 'is-invalid'" data-mask="000000" />
                    <div class="erro-campo" th:if="${#fields.hasErrors('ra')}" th:errors="*{ra}"></div>
                </div>

                <div class="campo">
                    <label for="telefone" th:text="#{estudante.telefone.label}">Telefone</label>
                    <input type="text" id="telefone" placeholder="(XX)XXXXX-XXXX" th:field="*{telefone}"
                           th:classappend="${#fields.hasErrors('telefone')} ? 'is-invalid'" data-mask="(00)00000-0000" />
                    <div class="erro-campo" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}"></div>
                </div>

                <div class="campo">
                    <label for="sexo" th:text="#{estudante.sexo.label}">Sexo</label>
                    <select id="sexo" th:field="*{sexo}" th:classappend="${#fields.hasErrors('sexo')} ? 'is-invalid'">
                        <option value="" th:text="#{selecione}">Selecione...</option>
                        <option th:each="s : ${T(br.ufscar.dc.dsw.domain.Estudante.Sexo).values()}"
                                th:value="${s}" th:text="#{${'estudante.sexo.' + s}}"></option>
                    </select>
                    <div class="erro-campo" th:if="${#fields.hasErrors('sexo')}" th:errors="*{sexo}"></div>
                </div>

                <div class="campo">
                    <label for="nascimento" th:text="#{estudante.nascimento.label}">Data de Nascimento</label>
                    <input type="date" id="nascimento" th:field="*{nascimento}"
                           th:classappend="${#fields.hasErrors('nascimento')} ? 'is-invalid'" />
                    <div class="erro-campo" th:if="${#fields.hasErrors('nascimento')}" th:errors="*{nascimento}"></div>
                </div>
            </div>

            <div class="acoes-form">
                <button type="submit" class="btn btn-primario" th:text="#{button.salvar}">Salvar</button>
                <a th:href="@{/estudantes/listar}" th:text="#{button.cancelar}">Cancelar</a>
            </div>
        </form>
    </main>

    <footer>
        <p th:text="#{footer.texto}">&copy; 2025 Materialis</p>
    </footer>
    <div th:replace="~{fragments/nav :: tabs('')}"></div>
</body>
</html>
