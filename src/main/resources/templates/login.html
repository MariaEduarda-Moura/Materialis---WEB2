<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#3C1EDF">
    <title th:text="#{login.titulo}">Entrar</title>
    <link rel="stylesheet" th:href="@{/css/materialis.css}" />
</head>
<body>
    <div class="login-tela">
        <div class="login-card">
            <h1>Materialis</h1>
            <p class="login-subtitulo" th:text="#{login.subtitulo}">Acesse para solicitar, anunciar e gerenciar empréstimos.</p>

            <form th:action="@{/login}" method="post">
                <div class="campo">
                    <label for="username" th:text="#{login.email.label}">E-mail</label>
                    <input type="text" id="username" name="username" placeholder="email@email.com"
                           th:classappend="${param.error} ? 'is-invalid'" />
                </div>
                <div class="campo">
                    <label for="password" th:text="#{login.senha.label}">Senha</label>
                    <input type="password" id="password" name="password" placeholder="••••••"
                           th:classappend="${param.error} ? 'is-invalid'" />
                </div>

                <div th:if="${param.error}" class="flash fail" role="alert" th:text="#{login.erro}">Credenciais inválidas.</div>
                <div th:if="${param.logout}" class="flash success" role="alert" th:text="#{login.saiu}">Desconectado com sucesso.</div>

                <button type="submit" class="btn btn-primario" th:text="#{login.entrar}">Entrar</button>
            </form>
        </div>
    </div>
</body>
</html>
